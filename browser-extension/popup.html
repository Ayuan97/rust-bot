<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Rust+ Credentials Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 24px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .info {
            font-size: 11px;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .status {
            background: rgba(0, 217, 160, 0.1);
            border: 1px solid rgba(0, 217, 160, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 12px;
            text-align: center;
        }

        .status.has-token {
            background: rgba(0, 217, 160, 0.15);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <h1>🎮 Rust+ Token Helper</h1>
    <p class="subtitle">获取 Steam Auth Token</p>

    <div class="status hidden" id="tokenStatus">
        ✅ 已有 Token - <a href="#" id="viewTokenLink" style="color: #00d9a0;">查看</a>
    </div>

    <button class="btn btn-primary" id="startBtn">
        🔐 使用 Steam 登录
    </button>

    <button class="btn btn-secondary hidden" id="viewResultBtn">
        📋 查看已获取的 Token
    </button>

    <button class="btn btn-secondary hidden" id="clearBtn">
        🗑️ 清除已保存的 Token
    </button>

    <p class="info">
        登录成功后会自动跳转到结果页面<br>
        你可以复制 Token 配合 FCM 凭证使用
    </p>

    <script src="popup-simple.js"></script>
</body>

</html>
