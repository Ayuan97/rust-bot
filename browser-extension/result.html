<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Rust+ 凭证结果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #00d9a0;
        }

        .subtitle {
            color: #a0a0a0;
            margin-bottom: 24px;
        }

        .token-box {
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            color: #00d9a0;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        .label {
            color: #888;
            font-size: 12px;
            text-align: left;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d9a0, #00b894);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 217, 160, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .info {
            background: rgba(0, 217, 160, 0.1);
            border: 1px solid rgba(0, 217, 160, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 24px;
            font-size: 13px;
            color: #a0a0a0;
            text-align: left;
        }

        .info strong {
            color: #00d9a0;
        }

        .loading {
            padding: 60px;
        }

        .loading h1 {
            color: #e94560;
        }

        .hidden {
            display: none !important;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 217, 160, 0.1);
            border-top-color: #00d9a0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .details-section {
            margin-top: 20px;
            text-align: left;
        }

        details summary {
            cursor: pointer;
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .token-box.mini {
            max-height: 60px;
            font-size: 11px;
            margin: 5px 0 15px 0;
        }

        .copy-feedback {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00d9a0;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        /* 信息提示样式 */
        .expire-info {
            background: rgba(0, 217, 160, 0.1);
            border: 1px solid rgba(0, 217, 160, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .expire-icon {
            font-size: 18px;
        }

        .expire-info strong {
            color: #00d9a0;
        }

        /* 凭证项样式 */
        .credential-item {
            margin-bottom: 16px;
            text-align: left;
        }

        .credential-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .credential-header .label {
            margin-bottom: 0;
        }

        .copy-btn {
            background: rgba(0, 217, 160, 0.2);
            border: 1px solid rgba(0, 217, 160, 0.3);
            color: #00d9a0;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(0, 217, 160, 0.3);
        }

        .copy-btn.copied {
            background: #00d9a0;
            color: #000;
        }

        .token-box.single-line {
            max-height: none;
            overflow: visible;
            padding: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 加载状态 -->
        <div class="card loading" id="loadingState">
            <h1>⏳ 等待登录...</h1>
            <p class="subtitle">请在 Rust+ 页面完成 Steam 登录</p>
        </div>

        <!-- 注册中状态 -->
        <div class="card hidden" id="registeringState">
            <h1>⏳ 正在注册 FCM...</h1>
            <p class="subtitle">正在与后端通信获取推送凭证</p>
            <div class="spinner"></div>
        </div>

        <!-- 成功状态 -->
        <div class="card hidden" id="successState">
            <h1>✅ 凭证获取成功!</h1>
            <p class="subtitle">复制以下命令到程序中使用</p>

            <!-- 注册时间提示 -->
            <div class="expire-info">
                <span class="expire-icon">📅</span>
                <span>注册时间: <strong id="registerDate">-</strong></span>
            </div>

            <!-- 程序需要的命令格式 -->
            <div class="label">凭证命令 (复制到程序)</div>
            <div class="token-box" id="credentialsCommand" style="font-size: 11px;"></div>

            <div class="actions">
                <button class="btn btn-primary" id="copyCommandBtn">📋 复制命令</button>
                <button class="btn btn-secondary" id="downloadBtn">💾 下载配置</button>
            </div>

            <div class="details-section">
                <details>
                    <summary>查看详细字段</summary>

                    <div class="credential-item">
                        <div class="credential-header">
                            <span class="label">GCM Android ID</span>
                            <button class="copy-btn" data-target="gcmAndroidId">复制</button>
                        </div>
                        <div class="token-box mini" id="gcmAndroidId"></div>
                    </div>

                    <div class="credential-item">
                        <div class="credential-header">
                            <span class="label">GCM Security Token</span>
                            <button class="copy-btn" data-target="gcmSecurityToken">复制</button>
                        </div>
                        <div class="token-box mini" id="gcmSecurityToken"></div>
                    </div>

                    <div class="credential-item">
                        <div class="credential-header">
                            <span class="label">Steam ID</span>
                            <button class="copy-btn" data-target="steamId">复制</button>
                        </div>
                        <div class="token-box mini" id="steamId"></div>
                    </div>

                    <div class="label" style="margin-top: 15px;">完整 JSON (调试用)</div>
                    <div class="token-box mini" id="fullCredentialsDisplay"></div>
                </details>
            </div>
        </div>

        <!-- 错误状态 -->
        <div class="card hidden" id="errorState">
            <h1>❌ 获取失败</h1>
            <p class="subtitle" id="errorMessage">未能捕获认证数据</p>
            <div class="actions">
                <button class="btn btn-secondary" id="retryBtn">🔄 重试</button>
            </div>
        </div>
    </div>

    <div class="copy-feedback" id="copyFeedback">已复制到剪贴板!</div>

    <script src="result.js"></script>
</body>

</html>
