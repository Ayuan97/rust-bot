<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Rust+ 凭证结果</title>
    <style>
        :root {
            --bg: #0A0A0A;
            --panel: #0F0F0F;
            --panel2: #141414;
            --sink: #1A1A1A;
            --line: #2A2A2A;
            --line2: #3A3A3A;
            --fg: #EAEAEA;
            --fg-dim: #9A9A9A;
            --fg-mute: #6A6A6A;
            --hazard: #E0452E;
            --hazard-bright: #FF5A3C;
            --hazard-dim: rgba(224, 69, 46, 0.12);
            --terminal: #4AF626;
            --mono: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Courier New', monospace;
            --sans: 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Noto Sans SC', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* CRT 扫描线质感层 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 60;
            pointer-events: none;
            opacity: 0.5;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.22) 3px, transparent 4px);
        }

        .container {
            max-width: 620px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* 面板：直角 + 发丝线边框 + 四角角标 */
        .card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 36px;
        }

        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            pointer-events: none;
            z-index: 2;
        }

        .card::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid var(--hazard);
            border-left: 2px solid var(--hazard);
        }

        .card::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid var(--hazard);
            border-right: 2px solid var(--hazard);
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--hazard);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eyebrow .tick {
            width: 6px;
            height: 6px;
            background: var(--terminal);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--fg);
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--fg-dim);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg-dim);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-bottom: 8px;
        }

        .token-box {
            background: var(--sink);
            border: 1px solid var(--line);
            padding: 16px;
            margin: 8px 0 0;
            text-align: left;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.6;
            color: var(--fg);
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        .token-box::-webkit-scrollbar {
            width: 6px;
        }

        .token-box::-webkit-scrollbar-thumb {
            background: var(--line2);
        }

        .token-box.mini {
            max-height: 64px;
            font-size: 11px;
            color: var(--fg-dim);
            margin: 4px 0 14px;
        }

        .token-box.single-line {
            max-height: none;
            overflow: visible;
            padding: 12px;
        }

        /* ===== 按钮 ===== */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 22px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid;
            background: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }

        .btn-primary {
            background: var(--hazard);
            border-color: var(--hazard);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--hazard-bright);
            border-color: var(--hazard-bright);
        }

        .btn-secondary {
            background: none;
            border-color: var(--line);
            color: var(--fg-dim);
        }

        .btn-secondary:hover {
            border-color: var(--fg-dim);
            color: var(--fg);
        }

        /* ===== 加载 / spinner ===== */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--line);
            border-top-color: var(--hazard);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 24px auto 4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 注册时间 / 有效期信息条 ===== */
        .expire-info {
            background: var(--panel2);
            border: 1px solid var(--line);
            padding: 12px 14px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--fg-dim);
        }

        .expire-icon {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            color: var(--hazard);
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .expire-info strong {
            color: var(--fg);
            font-weight: 700;
        }

        /* ===== 凭证详情项 ===== */
        .details-section {
            margin-top: 22px;
            text-align: left;
        }

        details summary {
            cursor: pointer;
            font-family: var(--mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--fg-dim);
            padding: 10px 0;
            border-top: 1px solid var(--line);
            list-style: none;
            user-select: none;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        details summary::before {
            content: '+ ';
            color: var(--hazard);
        }

        details[open] summary::before {
            content: '− ';
        }

        details summary:hover {
            color: var(--fg);
        }

        .credential-item {
            margin-bottom: 14px;
            text-align: left;
        }

        .credential-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .credential-header .label {
            margin-bottom: 0;
        }

        .copy-btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--fg-dim);
            padding: 4px 12px;
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.15s;
        }

        .copy-btn:hover {
            border-color: var(--hazard);
            color: var(--hazard-bright);
        }

        .copy-btn.copied {
            background: var(--hazard);
            border-color: var(--hazard);
            color: #fff;
        }

        /* ===== 复制反馈 toast ===== */
        .copy-feedback {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--hazard);
            color: #fff;
            padding: 12px 22px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s;
            z-index: 80;
            pointer-events: none;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 加载状态 -->
        <div class="card loading" id="loadingState">
            <div class="eyebrow">// AWAITING AUTH</div>
            <h1>等待登录</h1>
            <p class="subtitle">请在 Rust+ 页面完成 Steam 登录</p>
            <div class="spinner"></div>
        </div>

        <!-- 注册中状态 -->
        <div class="card hidden" id="registeringState">
            <div class="eyebrow">// FCM REGISTRATION</div>
            <h1>正在注册 FCM</h1>
            <p class="subtitle">正在与后端通信获取推送凭证</p>
            <div class="spinner"></div>
        </div>

        <!-- 成功状态 -->
        <div class="card hidden" id="successState">
            <div class="eyebrow"><span class="tick"></span>// CREDENTIALS READY</div>
            <h1>凭证获取成功</h1>
            <p class="subtitle">复制以下命令到程序中使用</p>

            <!-- 注册 / 有效期信息 -->
            <div class="expire-info">
                <span class="expire-icon">[i]</span>
                <span>注册时间: <strong id="registerDate">-</strong></span>
            </div>

            <!-- 程序需要的命令格式 -->
            <div class="label">凭证命令 // COMMAND</div>
            <div class="token-box" id="credentialsCommand"></div>

            <div class="actions">
                <button class="btn btn-primary" id="copyCommandBtn">复制命令</button>
                <button class="btn btn-secondary" id="downloadBtn">下载配置</button>
            </div>

            <div class="details-section">
                <details>
                    <summary>查看详细字段 // RAW FIELDS</summary>

                    <div class="credential-item" style="margin-top: 14px;">
                        <div class="credential-header">
                            <span class="label">GCM Android ID</span>
                            <button class="copy-btn" data-target="gcmAndroidId">复制</button>
                        </div>
                        <div class="token-box mini" id="gcmAndroidId"></div>
                    </div>

                    <div class="credential-item">
                        <div class="credential-header">
                            <span class="label">GCM Security Token</span>
                            <button class="copy-btn" data-target="gcmSecurityToken">复制</button>
                        </div>
                        <div class="token-box mini" id="gcmSecurityToken"></div>
                    </div>

                    <div class="credential-item">
                        <div class="credential-header">
                            <span class="label">Steam ID</span>
                            <button class="copy-btn" data-target="steamId">复制</button>
                        </div>
                        <div class="token-box mini" id="steamId"></div>
                    </div>

                    <div class="label" style="margin-top: 8px;">完整 JSON // DEBUG</div>
                    <div class="token-box mini" id="fullCredentialsDisplay"></div>
                </details>
            </div>
        </div>

        <!-- 错误状态 -->
        <div class="card hidden" id="errorState">
            <div class="eyebrow">// ERROR</div>
            <h1>获取失败</h1>
            <p class="subtitle" id="errorMessage">未能捕获认证数据</p>
            <div class="actions">
                <button class="btn btn-secondary" id="retryBtn">重试</button>
            </div>
        </div>
    </div>

    <div class="copy-feedback" id="copyFeedback">已复制到剪贴板!</div>

    <script src="result.js"></script>
</body>

</html>
