version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: rust-bot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rustplus_db}
      MYSQL_USER: ${MYSQL_USER:-rustplus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rustplus123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rust-bot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7.0-alpine
    container_name: rust-bot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - rust-bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}

  # ==================== 代理服务 ====================
  proxy:
    image: v2fly/v2fly-core:latest
    container_name: rust-bot-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_SOCKS_PORT:-10808}:10808"
      - "${PROXY_HTTP_PORT:-10809}:10809"
    volumes:
      - ./proxy/config.json:/etc/v2ray/config.json:ro
    networks:
      - rust-bot-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:10809"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rust-bot-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      # 应用配置
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # 数据库配置
      - DATABASE_URL=mysql://${MYSQL_USER:-rustplus}:${MYSQL_PASSWORD:-rustplus123}@mysql:3306/${MYSQL_DATABASE:-rustplus_db}
      - DATABASE_PROVIDER=mysql

      # Redis 配置
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379

      # JWT 配置
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_in_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}

      # 代理配置（全局）
      - HTTP_PROXY=http://proxy:10809
      - HTTPS_PROXY=http://proxy:10809
      - ALL_PROXY=socks5://proxy:10808
      - NO_PROXY=mysql,redis,localhost,127.0.0.1

      # 支付配置
      - ALIPAY_APP_ID=${ALIPAY_APP_ID:-}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY:-}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_MCH_ID=${WECHAT_MCH_ID:-}
      - WECHAT_API_KEY=${WECHAT_API_KEY:-}

      # 邮件配置（可选）
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - rust-bot-data:/app/data
    networks:
      - rust-bot-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-}
    container_name: rust-bot-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rust-bot-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ==================== 网络 ====================
networks:
  rust-bot-network:
    driver: bridge

# ==================== 数据卷 ====================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rust-bot-data:
    driver: local
